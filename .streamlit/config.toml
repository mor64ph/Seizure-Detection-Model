# Must live at the repository ROOT. Streamlit reads $CWD/.streamlit/config.toml,
# and Streamlit Community Cloud runs from the repo root regardless of where the
# entrypoint sits. At seizure-detection/.streamlit/ it was silently ignored, so
# the app shipped with the default dark theme and the 200 MB upload cap.

[server]
# A one-hour CHB-MIT record is ~51 MB, so 200 MB accepts any single record with
# room to spare. Note that the binding constraint is RAM, not this number: EDF
# is int16 on disk and mne preloads float64, so decoding costs 4x the file size
# and a 200 MB upload peaks near 1 GB. The app estimates that before decoding
# and refuses with an explanation rather than being OOM-killed, which would
# surface to a visitor as an unexplained connection error. Raise
# SEIZURE_MAX_DECODE_MB when running somewhere with more memory.
maxUploadSize = 200
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1565c0"
