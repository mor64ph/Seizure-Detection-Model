[project]
name = "seizure-detection"
version = "0.1.0"
description = "Cross-patient seizure detection on CHB-MIT scalp EEG"
requires-python = ">=3.11"
dependencies = [
  "mne", "numpy", "scipy", "pandas", "pyarrow",
  "scikit-learn", "pyyaml", "pydantic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
spark = ["pyspark", "delta-spark"]

[project.scripts]
seizure = "seizure.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
